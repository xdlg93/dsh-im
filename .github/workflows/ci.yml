name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Build, test, and verify the package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # The lockfile is lockfileVersion 9, produced by pnpm 11; pin the major
          # so CI resolves the same dependency graph.
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check` builds lib/, runs the node:test suite, and verifies the shipped
      # artifacts (loader id, settings section, the two channels, compatibility).
      - name: Run checks
        run: npm run check

name: Release

# A local DSH has no GitHub token, so releases are published by Actions: the
# workflow's own GITHUB_TOKEN has contents:write and the runner ships `gh`.
#
# Three ways in:
#   - push a v* tag            → publish that tag's release
#   - change docs/releases/**  → refresh every listed release from its notes file
#   - workflow_dispatch        → publish the tag given, or refresh all when empty
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'docs/releases/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.3.2 (empty refreshes every docs/releases file)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_INPUT}" ]; then
            targets="${TAG_INPUT}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            targets="${REF_NAME}"
          else
            # A notes change refreshes every release it names.
            targets="$(ls docs/releases/*.md 2>/dev/null | sed 's#docs/releases/##; s#\.md$##' | tr '\n' ' ' || true)"
          fi
          echo "targets: ${targets:-<none>}"

          for TAG in ${targets}; do
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "skip ${TAG}: no such tag"
              continue
            fi
            # docs/releases/<tag>.md is the curated body; without it, let GitHub
            # generate notes from the commits.
            if [ -f "docs/releases/${TAG}.md" ]; then
              NOTES="--notes-file docs/releases/${TAG}.md"
            else
              NOTES="--generate-notes"
            fi
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "${TAG}" ${NOTES}
              echo "updated ${TAG}"
            else
              gh release create "${TAG}" --title "${TAG}" ${NOTES}
              echo "created ${TAG}"
            fi

            # Attach this tag's own tarball whenever the tree carries it, so a
            # notes refresh also repairs an asset that was uploaded from an older
            # pack. One canonical asset per release: anything else is removed.
            CANONICAL="dsh-im-${TAG#v}.tgz"
            if [ -f "docs/pkg/${CANONICAL}" ]; then
              gh release upload "${TAG}" "docs/pkg/${CANONICAL}" --clobber
            fi
            while IFS= read -r asset; do
              [ -z "${asset}" ] && continue
              [ "${asset}" = "${CANONICAL}" ] && continue
              gh release delete-asset "${TAG}" "${asset}" --yes
            done < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          done
